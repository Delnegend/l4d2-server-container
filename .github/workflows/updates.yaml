name: Upstream updates

# One check a day against the four things this repository pins: Valve's depot
# manifests, l4dtoolz's newest stable release, the head of the 5+ plugin repo,
# and the newest No-Steam-logon bypass release. Anything stale becomes one pull
# request that rewrites the Dockerfile ARGs and the architecture table, and
# merges itself once CI is green.
#
# MetaMod and SourceMod are deliberately not pinned - the Dockerfile resolves
# both to the newest build on SOURCEMOD_BRANCH - so they appear in the report
# and nothing else.
on:
  schedule:
    # 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-updates
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      pins_stale: ${{ steps.upstream.outputs.pins_stale }}
      pins_summary: ${{ steps.upstream.outputs.pins_summary }}
      game_manifest: ${{ steps.upstream.outputs.game_manifest }}
      launcher_manifest: ${{ steps.upstream.outputs.launcher_manifest }}
      l4dtoolz_version: ${{ steps.upstream.outputs.l4dtoolz_version }}
      l4dtoolz_build: ${{ steps.upstream.outputs.l4dtoolz_build }}
      plugins_ref: ${{ steps.upstream.outputs.plugins_ref }}
      block_logon_release: ${{ steps.upstream.outputs.block_logon_release }}
      block_logon_asset: ${{ steps.upstream.outputs.block_logon_asset }}
      sourcemod_branch: ${{ steps.upstream.outputs.sourcemod_branch }}
      mmsource_drop: ${{ steps.upstream.outputs.mmsource_drop }}
      sourcemod_drop: ${{ steps.upstream.outputs.sourcemod_drop }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare the pins with upstream
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/resolve-upstream.py | tee -a "$GITHUB_OUTPUT"

  bump:
    needs: resolve
    if: needs.resolve.outputs.pins_stale == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rewrite the pins in the Dockerfile and the architecture table
        run: |
          python3 scripts/apply-bump.py \
            --game-manifest '${{ needs.resolve.outputs.game_manifest }}' \
            --launcher-manifest '${{ needs.resolve.outputs.launcher_manifest }}' \
            --l4dtoolz-version '${{ needs.resolve.outputs.l4dtoolz_version }}' \
            --l4dtoolz-build '${{ needs.resolve.outputs.l4dtoolz_build }}' \
            --plugins-ref '${{ needs.resolve.outputs.plugins_ref }}' \
            --block-logon-release '${{ needs.resolve.outputs.block_logon_release }}' \
            --block-logon-asset '${{ needs.resolve.outputs.block_logon_asset }}'

      - name: Open the pull request and queue it for merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A bump branch outlives its pull request. The repository is set to
          # delete head branches on merge, but that does not fire for the
          # auto-merge rebase this job queues - every bump merged that way has
          # left its branch behind - and a superseded pull request is closed
          # rather than merged anyway. A branch with no open pull request is
          # dead, so clear it out. Best effort: a branch that refuses to go
          # should not stop the bump.
          live=$(gh pr list --state open --limit 100 --json headRefName --jq '.[].headRefName')
          for ref in $(git ls-remote --heads origin 'refs/heads/automation/bump-*' | sed 's#.*refs/heads/##'); do
            if printf '%s\n' "$live" | grep -qx "$ref"; then
              continue
            fi
            echo "Deleting ${ref}: no open pull request uses it."
            git push origin --delete "$ref" \
              || echo "Could not delete ${ref}; the next run will try again."
          done

          # An open bump pull request only counts as handled while it can still
          # merge. Anything that lands on main edits the same ARG lines and
          # architecture rows this job rewrites, so the open pull request ends
          # up in conflict sooner or later - unable to merge itself, and able
          # to freeze the pins for as long as it stays open, because standing
          # down is what this job used to do about it. Replace it instead, on
          # today's base, and delete the branch it was left on.
          open=$(gh pr list --state open \
                   --search 'bump the pinned upstream versions in:title' \
                   --json number,mergeable \
                   --jq '.[0] | select(.) | "\(.number) \(.mergeable)"')

          if [ -n "$open" ]; then
            number="${open%% *}"
            mergeable="${open##* }"
            # MERGEABLE and UNKNOWN are both "leave it alone": GitHub computes
            # mergeability lazily, and one more day of waiting is cheaper than
            # a second pull request for the same bump.
            if [ "$mergeable" != 'CONFLICTING' ]; then
              echo "Pull request #${number} is ${mergeable}; leaving it alone."
              exit 0
            fi
            echo "Pull request #${number} is CONFLICTING; replacing it."
            gh pr close "$number" --delete-branch --comment \
              'Superseded: main moved under this branch and it can no longer merge, so the daily check opened a fresh pull request against the current base instead of standing down.'
          fi

          branch="automation/bump-$(date -u +%Y%m%d)"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am 'build: bump the pinned upstream versions'
          git push -u origin "$branch"

          gh pr create \
            --title 'build: bump the pinned upstream versions' \
            --body "$(cat <<'BODY'
          Upstream moved; the pins in `Dockerfile` no longer match it.

          ```
          ${{ needs.resolve.outputs.pins_summary }}
          ```

          `scripts/resolve-upstream.py` found the difference and
          `scripts/apply-bump.py` rewrote the `ARG` defaults and the matching
          rows in `docs/architecture.md`.

          - **Valve** — `GAME_MANIFEST` (depot 222861, the game) and
            `LAUNCHER_MANIFEST` (depot 222863, which is where `srcds_run`
            lives). The entrypoint downloads both on the first start of a
            volume, and re-downloads when either one changes.
          - **l4dtoolz** — the newest stable release carrying a
            `l4dtoolz-<version>-<build>.zip`.
          - **5+ plugins** — the head commit of
            [fbef0102/L4D1_2-Plugins](https://github.com/fbef0102/L4D1_2-Plugins).
          - **No-Steam-logon bypass** — the newest release shipping a
            `modified-plugins-sm-1.12-<date>.zip`.

          `just verify` downloads both pinned manifests, boots the server and
          checks the plugin stack, so a green `Check (just verify)` is the
          proof. Merging does not publish: it lands on `main`, and releasing is
          a separate run of `release.yaml` — the Sunday cron or a dispatch.

          MetaMod and SourceMod are not pinned and need nothing here. The
          current drops on `${{ needs.resolve.outputs.sourcemod_branch }}` are
          `${{ needs.resolve.outputs.mmsource_drop }}` and
          `${{ needs.resolve.outputs.sourcemod_drop }}`.
          BODY
          )"

          # Auto-merge if branch protection requires status checks; otherwise
          # merge directly if the pull request is already in clean status.
          gh pr merge --auto --rebase 2>/dev/null || gh pr merge --rebase || true

  report:
    # Runs whether or not anything was stale: this is the record of where the
    # pins actually are, so a quiet week is still readable.
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Record the current pin state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const summary = `${{ needs.resolve.outputs.pins_summary }}`
            const stale = !summary.startsWith('every pin matches')

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const board = open.data.find((issue) => issue.title === 'Upstream pin state')

            const body = [
              'Upstream state as of this run. Edited in place, not re-posted.',
              '',
              '```',
              summary,
              '```',
              '',
              `- depot 222861 manifest: \`${{ needs.resolve.outputs.game_manifest }}\``,
              `- depot 222863 manifest: \`${{ needs.resolve.outputs.launcher_manifest }}\` (srcds_run)`,
              `- MetaMod:Source drop: \`${{ needs.resolve.outputs.mmsource_drop }}\``,
              `- SourceMod drop: \`${{ needs.resolve.outputs.sourcemod_drop }}\``,
              '',
              stale
                ? 'Something was stale: see the open "bump the pinned upstream versions" pull request.'
                : 'Nothing is stale, so no pull request was opened.',
            ].join('\n')

            // One issue, edited in place, so this reads as a status board rather
            // than a daily pile of noise. Matching on the title keeps it from
            // depending on a label that may not exist in the repository.
            if (board) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: board.number,
                body,
              })
              return
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Upstream pin state',
              body,
            })
