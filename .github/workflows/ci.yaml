name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/delnegend/l4d2-server-container

jobs:
  verify:
    # This is the gate, and a required check on main: nothing merges, and
    # nothing gets published, without it. It boots a real server, checks the A2S
    # self-check and the plugin stack, and fails on any `Unknown command` the
    # game build introduces.
    name: Check (just verify)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docs check, install, A2S self-check, plugin stack
        run: just verify
        env:
          CONTAINER_ENGINE: docker
          EXTRA_BUILD_ARGS: --cache-from type=registry,ref=${{ env.IMAGE }}:buildcache --load
          L4D2_SMOKE_DIR: ${{ github.workspace }}/.smoke

  # Security scans. They need Docker images and registry egress, so they only run
  # on GitHub-hosted runners. None of them is a required check — the branch
  # protection contract stays `Check (just verify)`, which is this repo's gate.
  scan:
    name: Scan
    uses: Delnegend/actions/.github/workflows/scan.yml@6b0ff42cc9e8937cd1b37faebccd093fc6c68a86 # v1
    permissions:
      contents: read
    with:
      scans: gitleaks actionlint semgrep trivy
