name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/delnegend/l4d2-server-container

jobs:
  verify:
    # This is the gate, and a required check on main: nothing merges, and
    # nothing gets published, without it. It boots a real server, checks the A2S
    # self-check and the plugin stack, and fails on any `Unknown command` the
    # game build introduces.
    name: Check (just verify)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docs check, install, A2S self-check, plugin stack
        run: just verify
        env:
          CONTAINER_ENGINE: docker
          EXTRA_BUILD_ARGS: --cache-from type=registry,ref=${{ env.IMAGE }}:buildcache --load
          L4D2_SMOKE_DIR: ${{ github.workspace }}/.smoke

  # Security scans. They need Docker images and registry egress, so they only run
  # on GitHub-hosted runners. None of them is a required check — the branch
  # protection contract stays `Check (just verify)`, which is this repo's gate.
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the whole history: a leaked secret lives in it
      - name: Run Gitleaks
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/path" ghcr.io/gitleaks/gitleaks:latest detect --source=/path --verbose

  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Semgrep OSS
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/src" returntocorp/semgrep semgrep scan --config=auto --error

  trivy-scan:
    name: Misconfig & Vulns (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Trivy
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/src" aquasec/trivy fs /src --severity HIGH,CRITICAL --scanners vuln,misconfig --exit-code 1

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned, unlike the scanners above which float on :latest. actionlint
      # gains checks between releases, so a floating tag can fail an unrelated
      # commit when a new rule lands.
      - name: Run actionlint
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" rhysd/actionlint:1.7.12
