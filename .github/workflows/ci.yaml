name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  verify:
    # Boots a real server: A2S self-check, plugin stack, no `Unknown command`.
    name: Check (just verify)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install, A2S self-check, plugin stack
        run: just verify
        env:
          CONTAINER_ENGINE: docker
          EXTRA_BUILD_ARGS: --load
          L4D2_SMOKE_DIR: ${{ github.workspace }}/.smoke

  scan:
    name: Scan
    uses: Delnegend/actions/.github/workflows/scan.yml@main  # nosemgrep
    permissions:
      contents: read
