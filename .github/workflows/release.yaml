name: Release / Build Artifacts

on:
  # No version input: the number comes from the commits.
  workflow_dispatch:
    inputs:
      ref:
        description: "Empty = ship a new version. SHA = test-build it (no publish). Tag = rebuild it."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (gate, bump, tag, build, publish) without doing any of it."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write


jobs:
  prepare:
    name: Prepare / Bump Version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      # version_strict distinguishes step output from version input.
      version_strict: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist_credentials: true
          fetch-depth: 0

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Calculate Next SemVer
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          # The oldest tag that exists, used only if every other tag is ever
          # deleted. Must name a real tag or the action errors.
          fallbackTag: v1.0.0
          # `build:` ships image changes, so it bumps patch rather than nothing.
          patchList: fix, bugfix, perf, refactor, test, tests, build
          # Silent: weeks with nothing to release end green, not failed.
          noNewCommitBehavior: silent
          noVersionBumpBehavior: silent

      - name: CI Gate (verify code is green before bumping)
        if: steps.semver.outputs.next != ''
        run: just check

      - name: Bump, tag, and push
        id: resolve
        uses: Delnegend/actions/resolve-release@62064acc9dce2872175e85b3b2e1c2295cd1bee7 # v1
        with:
          ref: ${{ inputs.ref }}
          dry-run: ${{ inputs.dry-run }}
          gate-sha: ${{ github.sha }}
          # The maintainer-owned release version lives in VERSION and is
          # injected into the image as the SERVER_VERSION build argument.
          semver-bump: ${{ steps.semver.outputs.bump }}
          semver-current: ${{ steps.semver.outputs.current }}
          semver-next: ${{ steps.semver.outputs.next }}
          semver-next-strict: ${{ steps.semver.outputs.nextStrict }}

  build:
    name: Build & Release Artifacts
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Build and push server
        id: build
        uses: Delnegend/actions/docker-build-push@62064acc9dce2872175e85b3b2e1c2295cd1bee7 # v1
        with:
          version: ${{ needs.prepare.outputs.version_strict }}
          publish: ${{ needs.prepare.outputs.publish }}
          target: server
          build-args: |
            SERVER_VERSION=${{ needs.prepare.outputs.version_strict }}

      - name: Publish the release
        uses: Delnegend/actions/publish-release@62064acc9dce2872175e85b3b2e1c2295cd1bee7 # v1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          publish: ${{ needs.prepare.outputs.publish }}
          container: true
          version: ${{ needs.prepare.outputs.version_strict }}
