name: Release / Build Artifacts

# One image, one version, decided by the commit history rather than by anyone
# typing a number.
#
# `semver-action` reads the Conventional Commits since the latest tag and
# returns the next version. Nothing here - no flag, no input, no hand-rolled
# arithmetic - can override it, so the version is a fact about the commits and
# not a claim someone made about them.
#
#   feat:  -> minor      fix/refactor/build: -> patch
#   everything else                 -> no bump, so nothing is released
#
# The version is automatic; the timing is not. Shipping an image is a
# deliberate act, and the weekly cron below is the only thing that presses the
# button without a human. The run has three targets, all reachable from
# Actions -> Run workflow:
#
#   new-tag (default)  gate on CI, bump the version, tag & push, then build
#   tag                rebuild an existing tag and publish its release
#   commit             test build the latest commit; load the image only
#
# `build:` is in the patch list because this repository uses `build:` for
# changes that ship inside the image (Dockerfile, mod stack, overlay). It
# would otherwise produce no version, and an image change would go out under
# the previous tag.

on:
  # No version field: the number comes from the commits, so there is nothing
  # to type and nothing to get wrong.
  workflow_dispatch:
    inputs:
      ref:
        description: "Empty = ship a new version. SHA = test-build it (no publish). Tag = rebuild it."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (gate, bump, tag, build, publish) without doing any of it."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC (defaults to target: new-tag)

# Serialise releases: two concurrent runs must never race for the same version.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  # A literal, lowercase, with no expressions. `${{ github.repository }}`
  # expands to `Delnegend/...`, and buildx rejects a mixed-case image
  # reference before it builds anything:
  #   invalid tag "ghcr.io/Delnegend/l4d2-server-container:1.1.0":
  #   repository name must be lowercase
  # `just check` enforces both halves of that rule.
  IMAGE: ghcr.io/delnegend/l4d2-server-container

jobs:
  prepare:
    name: Prepare / Bump Version
    # Orchestration plus `just check`, so the full runner is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      # semver-action calls the `v`-less version `nextStrict`; the key is
      # spelled `version_strict` rather than a bare `version:` so that
      # scripts/docs-check.py can keep telling a real `version:` input apart
      # from an output (its scan is a plain text search for the line).
      version_strict: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist_credentials: true
          fetch-depth: 0

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Calculate Next SemVer
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          # The oldest tag that exists, used only if every other tag is ever
          # deleted. Must name a real tag or the action errors.
          fallbackTag: v1.0.0
          # The action's defaults are fix, bugfix, perf, refactor, test, tests.
          # `build` is added because this repo ships image changes under that
          # prefix, and those must move the version.
          patchList: fix, bugfix, perf, refactor, test, tests, build
          # Nothing to release is a normal outcome, not a failure.
          noNewCommitBehavior: silent
          noVersionBumpBehavior: silent

      - name: CI Gate (verify code is green before bumping)
        if: steps.semver.outputs.next != ''
        run: just check

      - name: Bump, tag, and push
        id: resolve
        uses: Delnegend/actions/resolve-release@3914bdd59116118eb4a7bad3cb2c4a04ab380b64 # v1
        with:
          ref: ${{ inputs.ref }}
          dry-run: ${{ inputs.dry-run }}
          gate-sha: ${{ github.sha }}
          # The version is not written anywhere in the tree: it is injected
          # into the image as the SERVER_VERSION build argument, and `just
          # bump` is a documented no-op. So HEAD is tagged with no commit.
          manifest-path: ''
          bump-command: ''
          semver-bump: ${{ steps.semver.outputs.bump }}
          semver-current: ${{ steps.semver.outputs.current }}
          semver-next: ${{ steps.semver.outputs.next }}
          semver-next-strict: ${{ steps.semver.outputs.nextStrict }}

  build:
    name: Build & Release Artifacts
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    # A container image build, so it needs the full runner's toolchain.
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release
      packages: write   # to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One published image, with exactly two tags: the exact version and
      # `latest`. No rolling major.minor or major tags, and no per-target tag,
      # so `:1.0.3` always means the same thing and there is nothing ambiguous
      # to accidentally deploy.
      #
      # `target: commit` is a test build: nothing is pushed, the image is only
      # loaded into the runner's local store, and the GitHub Release is not
      # published.
      #
      # The registry blobs are zstd level 4. Anything that pulls this image
      # needs a runtime that understands zstd layers (containerd 1.7+,
      # Docker 20.10+, podman 3+); if that ever stops being true, change the
      # `outputs` line to `type=image,compression=gzip`.
      - name: Build and push server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: server
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          load: ${{ needs.prepare.outputs.publish != 'true' }}
          build-args: |
            SERVER_VERSION=${{ needs.prepare.outputs.version_strict }}
          outputs: ${{ needs.prepare.outputs.publish == 'true' && 'type=image,compression=zstd,compression-level=4' || '' }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.prepare.outputs.version_strict }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version_strict }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true

      # The tag already exists by the time this runs: `prepare` created and
      # pushed it before the build started. That is the point - the release
      # names a version that is already a fact about the repository - but it
      # also means a build failure here leaves a tag with no release. The
      # repair is to re-run with `target: tag`, which rebuilds the tag and
      # publishes its release without touching the version.
      - name: Publish the release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          generate_release_notes: true
