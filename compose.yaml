# Runs the published image. There is deliberately no `build:` section: users
# pull a released image, and development happens through the justfile
# (`just build` / `just up`), which tags the local image the same way so compose
# picks it up.
services:
  l4d2:
    image: ${L4D2_IMAGE:-ghcr.io/delnegend/l4d2-server-container:latest}
    container_name: l4d2-server
    restart: unless-stopped
    # host networking avoids UDP NAT overhead and allows local LAN discovery
    network_mode: host
    userns_mode: keep-id
    user: "1000:1000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-27015}
      - STEAM_PORT=${STEAM_PORT:-26901}
      - SERVER_MODE=${SERVER_MODE:-8players}
      - SERVER_NAME=${SERVER_NAME:-Left 4 Dead 2 Dedicated Server}
      - RCON_PASSWORD=${RCON_PASSWORD:-ChangeThisRconPassword123}
      - SERVER_PASSWORD=${SERVER_PASSWORD:-}
      - DEFAULT_MAP=${DEFAULT_MAP:-c1m1_hotel}
      - STEAM_GROUP_ID=${STEAM_GROUP_ID:-}
      - STEAM_GROUP_EXCLUSIVE=${STEAM_GROUP_EXCLUSIVE:-0}
      - SV_CONSISTENCY=${SV_CONSISTENCY:-0}
      - SV_PURE=${SV_PURE:-0}
      - ADMIN_USERS=${ADMIN_USERS:-}
      - BLOCK_NO_STEAM_LOGON=${BLOCK_NO_STEAM_LOGON:-1}
      - EXTRA_ARGS=${EXTRA_ARGS:-}
      # GAME_MANIFEST is deliberately absent here: an empty interpolation
      # default would override the value the image bakes in. The image's ARG
      # is the default and the .env file above is the override.
    volumes:
      # Persistent configuration, custom maps, and server logs.
      # The ~10 GB game install is baked into the image.
      - ./data:/data
